<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" font-family="Inter, 'Helvetica Neue', Arial, system-ui, sans-serif">
  <!-- Background (cream) -->
  <rect width="640" height="720" fill="#f7f4ee"/>

  <!-- Title -->
  <text x="320" y="64" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4a3c">Pomodoro Timer</text>
  <text x="320" y="96" text-anchor="middle" font-size="16" fill="#6f6657">earthy · focus · rest</text>

  <!-- Timer card -->
  <g id="timer-card">
    <rect x="120" y="150" width="400" height="460" rx="20" fill="#efe9df" stroke="#c9a87c" stroke-width="2"/>
    <rect x="120" y="150" width="400" height="460" rx="20" fill="none" stroke="rgba(47,74,60,0.08)" stroke-width="8"/>

    <!-- Mode label -->
    <text x="320" y="220" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#6b8e5a">FOKUS</text>
    <rect x="270" y="232" width="100" height="4" rx="2" fill="#aac39a"/>

    <!-- Time display -->
    <text id="time-display" x="320" y="340" text-anchor="middle" font-size="120" font-weight="700" fill="#2b2620" font-variant-numeric="tabular-nums">25:00</text>

    <!-- Progress bar -->
    <rect x="170" y="392" width="300" height="12" rx="6" fill="#e3dccf"/>
    <rect id="progress-bar" x="170" y="392" width="210" height="12" rx="6" fill="#6b8e5a"/>

    <!-- Buttons -->
    <g id="btn-start">
      <rect x="150" y="460" width="120" height="52" rx="999" fill="#c97a5a"/>
      <text x="210" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#f7f4ee">Start</text>
    </g>
    <g id="btn-pause">
      <rect x="282" y="460" width="120" height="52" rx="999" fill="#efe9df" stroke="#8a6f4e" stroke-width="2"/>
      <text x="342" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#8a6f4e">Pause</text>
    </g>
    <g id="btn-reset">
      <rect x="414" y="460" width="76" height="52" rx="999" fill="#efe9df" stroke="#c9a87c" stroke-width="2"/>
      <text x="452" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#6f6657">Reset</text>
    </g>
  </g>

  <!-- Break-mode variant hint (small) -->
  <g transform="translate(0,0)" opacity="0.55">
    <rect x="232" y="640" width="176" height="40" rx="999" fill="#efe9df" stroke="#c9a87c" stroke-width="1.5"/>
    <text x="320" y="665" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6f4e">break: ISTIRAHAT · 05:00</text>
  </g>
</svg>
